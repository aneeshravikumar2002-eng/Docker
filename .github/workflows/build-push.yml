name: Build Push and Deploy to Docker Host

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: aneesh292002/docker1

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Show image name
        run: echo "Image name is $IMAGE_NAME"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build --no-cache -t $IMAGE_NAME:latest .

      - name: Push Docker image
        run: docker push $IMAGE_NAME:latest

  deploy-to-docker-host:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Deploy latest image on Docker host
        run: /home/ubuntu/pull-deploy.sh

      - name: Verify running container
        run: docker ps
