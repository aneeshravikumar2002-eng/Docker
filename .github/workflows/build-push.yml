name: Build Push and Deploy to Docker Host

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: aneesh292002/docker
  CONTAINER_NAME: docker
  HOST_PORT: 5000
  CONTAINER_PORT: 5000

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set image version
        id: version
        run: |
          IMAGE_TAG="build-${GITHUB_RUN_NUMBER}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Show image details
        run: |
          echo "Image name is $IMAGE_NAME"
          echo "Image version is $IMAGE_TAG"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build --no-cache \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Push latest image
        run: docker push $IMAGE_NAME:latest

      - name: Push version image
        run: docker push $IMAGE_NAME:$IMAGE_TAG

  deploy-to-docker-host:
    needs: build-and-push
    runs-on: self-hosted

    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}

    steps:
      - name: Show deployment details
        run: |
          echo "Deploying image: $IMAGE_NAME:$IMAGE_TAG"
          echo "Container name: $CONTAINER_NAME"
          echo "Host port: $HOST_PORT"
          echo "Container port: $CONTAINER_PORT"

      - name: Pull versioned image on Docker host
        run: docker pull $IMAGE_NAME:$IMAGE_TAG

      - name: Stop old container if running
        run: docker stop $CONTAINER_NAME || true

      - name: Remove old container if exists
        run: docker rm $CONTAINER_NAME || true

      - name: Deploy new container on Docker host
        run: |
          docker run -d \
            --name $CONTAINER_NAME \
            -p $HOST_PORT:$CONTAINER_PORT \
            $IMAGE_NAME:$IMAGE_TAG

      - name: Verify running container
        run: |
          docker ps --format "table {{.ID}}\t{{.Image}}\t{{.Names}}\t{{.Ports}}"

      - name: Test application locally
        run: |
          curl http://localhost:$HOST_PORT || true
